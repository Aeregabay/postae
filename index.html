 b.onkeydown=e=>{const h=e.target.closest?.('.dh');if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;e.preventDefault();
  const id=h.closest('[data-id]').dataset.id,i=S.stores.findIndex(x=>x.id===id),L=S.stores;
  if(e.key==='ArrowUp'&&i>0)placeStore(id,L[i-2]?.id,L[i-1].id);else if(e.key==='ArrowDown'&&i<L.length-1)placeStore(id,L[i+1].id,L[i+2]?.id);else return;
  drawStores();$(`[data-id="${id}"] .dh`,b)?.focus()};
 b.addEventListener('pointerdown',e=>{const h=e.target.closest('.dh');if(!h||e.button>0)return;e.preventDefault();
  const row=h.closest('.sr'),list=row.parentElement,y0=e.clientY,top0=row.getBoundingClientRect().top;let ap=0;S.dragging=true;row.classList.add('drag');
  const mv=ev=>{const nat=row.getBoundingClientRect().top-ap;ap=ev.clientY-y0+(top0-nat);row.style.transform=`translateY(${ap}px)`;
   const r=row.getBoundingClientRect(),mid=r.top+r.height/2,pv=row.previousElementSibling,nx=row.nextElementSibling;
   if(pv&&mid<pv.getBoundingClientRect().top+pv.offsetHeight/2)list.insertBefore(row,pv);else if(nx&&mid>nx.getBoundingClientRect().top+nx.offsetHeight/2)list.insertBefore(nx,row)};
  const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);S.dragging=false;
   if(ev.type==='pointerup'){const rows=[...list.children],i=rows.indexOf(row);placeStore(row.dataset.id,rows[i-1]?.dataset.id,rows[i+1]?.dataset.id)}drawStores();$(`[data-id="${row.dataset.id}"] .dh`,b)?.focus({preventScroll:true})};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)})}

/* ---------- Laden bearbeiten ---------- */
function openStore(id){const ex=id&&S.stores.find(x=>x.id===id),used=new Set(S.stores.map(s=>hexOf(s.color).toUpperCase()));
 const d={kind:ex?kindOf(ex):'Lebensmittel',fav:!!ex?.favorite,color:ex?hexOf(ex.color).toUpperCase():(SWATCH.find(c=>!used.has(c))||SWATCH[0])};
 let[H,Sa,V]=rgb2hsv(...hex2rgb(d.color));const b=sheet('');
 b.innerHTML=`<div class="shh"><button type="button" class="tb" id="ax">Abbrechen</button><h3>${ex?'Laden bearbeiten':'Neuer Laden'}</h3><button type="button" class="tb ok" id="ao">Speichern</button></div>
<div class="pv" aria-hidden="true"><span id="pva"></span><span id="pvb"></span></div>
<label for="sn">Name</label><input id="sn" maxlength="40" autocomplete="off" enterkeyhint="done" value="${esc(ex?.name||'')}" aria-describedby="ne"><div class="er" id="ne" role="alert"></div>
<label id="kl">Kategorie</label><div class="chips" role="radiogroup" aria-labelledby="kl" id="kk">${KINDS.map(k=>`<button type="button" class="chip${k===d.kind?' on':''}" role="radio" aria-checked="${k===d.kind}" data-k="${k}">${k}</button>`).join('')}</div>
<div class="rows" style="margin-top:14px"><div class="sr fr"><span class="tx"><span id="fl">Favorit</span><small id="fh">Favoriten stehen in der Filterleiste zuerst</small></span><button type="button" class="tgl" id="fv" role="switch" aria-checked="${d.fav}" aria-labelledby="fl" aria-describedby="fh"><i></i></button></div></div>
<label id="cl">Farbe</label><div class="swg" role="radiogroup" aria-labelledby="cl">${SWATCH.map(c=>`<button type="button" class="swb" role="radio" aria-checked="false" data-c="${c}" aria-label="Farbe ${c}"><span style="background:${c}">${ic('check')}</span></button>`).join('')}</div>
<div class="cc" id="cc"><div class="ccr"><span class="dot" id="cd"></span><b id="cl2">Eigene Farbe</b><div class="hx"><span aria-hidden="true">#</span><input id="hx" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Hex-Farbwert"></div></div>
<div class="pad" id="pad" tabindex="0" role="slider" aria-label="Sättigung und Helligkeit"><i></i></div>
<input id="hu" class="hs" type="range" min="0" max="360" step="1" aria-label="Farbton"></div>
${ex?`<div class="rows" style="margin-top:24px"><div class="sr"><button type="button" class="rb dng" id="dl">Laden löschen</button></div></div>`:''}`;
 const sn=$('#sn',b),hx=$('#hx',b),hu=$('#hu',b),pad=$('#pad',b),cc=$('#cc',b);
 const paint=skip=>{const c=d.color,ink=inkOf(c),nm=sn.value.trim();
  $('#pva',b).innerHTML=avHTML({name:nm||'Laden',color:c},'xl');$('#pvb',b).innerHTML=bgOne({name:nm||'Laden',color:c});
  $$('.swb',b).forEach(x=>{const on=x.dataset.c===c;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);x.firstElementChild.style.color=ink});
  $('#cd',b).style.background=c;if(skip!=='hx'){hx.value=c.slice(1);hx.removeAttribute('aria-invalid')}if(skip!=='hu')hu.value=Math.round(H);
  cc.style.setProperty('--h',H);const th=pad.firstElementChild;th.style.left=Sa*100+'%';th.style.top=(1-V)*100+'%';th.style.background=c;
  pad.setAttribute('aria-valuetext',`Sättigung ${Math.round(Sa*100)} %, Helligkeit ${Math.round(V*100)} %`)};
 const setHex=(c,skip)=>{d.color=c.toUpperCase();const[h,s,v]=rgb2hsv(...hex2rgb(d.color));if(s>0&&v>0)H=h;Sa=s;V=v;paint(skip)};
 const fromHsv=skip=>{d.color=hsv2hex(H,Sa,V);paint(skip)};
 paint();
 sn.oninput=()=>{sn.removeAttribute('aria-invalid');$('#ne',b).textContent='';paint('hx')};
 sn.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
 $('#kk',b).onclick=e=>{const c=e.target.closest('[data-k]');if(!c)return;d.kind=c.dataset.k;$$('.chip',$('#kk',b)).forEach(x=>{x.classList.toggle('on',x===c);x.setAttribute('aria-checked',x===c)})};
 $('#fv',b).onclick=e=>{d.fav=!d.fav;e.currentTarget.setAttribute('aria-checked',d.fav)};
 $$('.swb',b).forEach(x=>x.onclick=()=>setHex(x.dataset.c));
 hx.oninput=()=>{let v=hx.value.trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(v))v=[...v].map(c=>c+c).join('');
  if(/^[0-9a-f]{6}$/i.test(v)){hx.removeAttribute('aria-invalid');setHex('#'+v,'hx')}else hx.setAttribute('aria-invalid','true')};
 hx.onblur=()=>{if(hx.getAttribute('aria-invalid'))paint()};hx.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();hx.blur()}};
 hu.oninput=()=>{H=+hu.value;if(Sa<.05){Sa=.75;V=Math.max(V,.75)}fromHsv('hu')};
 let pd=false;const padAt=e=>{const r=pad.getBoundingClientRect();Sa=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));V=1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));fromHsv()};
 pad.onpointerdown=e=>{pd=true;pad.setPointerCapture(e.pointerId);padAt(e);e.preventDefault()};pad.onpointermove=e=>{if(pd)padAt(e)};pad.onpointerup=pad.onpointercancel=()=>{pd=false};
 pad.onkeydown=e=>{const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!k)return;e.preventDefault();Sa=Math.min(1,Math.max(0,Sa+k[0]*.03));V=Math.min(1,Math.max(0,V+k[1]*.03));fromHsv()};
 $('#ax',b).onclick=()=>closeSheet();
 const go=()=>{const name=sn.value.trim(),ne=$('#ne',b),bad=m=>{ne.textContent=m;sn.setAttribute('aria-invalid','true');sn.focus()};
  if(!name)return bad('Bitte einen Namen eingeben');
  if(S.stores.some(x=>x.id!==ex?.id&&x.name.toLowerCase()===name.toLowerCase()))return bad('Diesen Laden gibt es schon');
  const f={name,color:d.color,kind:d.kind,favorite:d.fav};
  if(ex){Object.assign(ex,f);enqueue({t:'stores',o:'update',id:ex.id,d:f})}
  else{const st={id:uid(),...f,sort:S.stores.reduce((m,s)=>Math.max(m,s.sort||0),0)+1};S.stores.push(st);enqueue({t:'stores',o:'insert',d:st})}
  S.stores.sort((x,y)=>x.sort-y.sort);closeSheet();render();S.stRedraw?.()};
 $('#ao',b).onclick=go;
 if(ex)$('#dl',b).onclick=async()=>{if(await askDelStore(ex))closeSheet()};
 else setTimeout(()=>sn.focus(),250)}

/* ---------- Sprache ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,lang='de-CH';
function startVoice(){const inp=$('#addIn'),mic=$('#micBtn');if(!SR){toast('Spracheingabe wird hier nicht unterstützt');return}
 if(rec){rec.stop();return}
 const r=rec=new SR();r.lang=lang;r.interimResults=true;r.continuous=false;let retry=false;
 r.onstart=()=>{mic.classList.add('on');inp.placeholder='Ich höre zu…'};
 r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript+' ';inp.value=t.trim()};
 r.onerror=e=>{if((e.error==='language-not-supported'||e.error==='service-not-allowed')&&lang==='de-CH'){lang='de-DE';retry=true}else if(e.error==='not-allowed')toast('Mikrofon nicht erlaubt');else if(e.error==='no-speech')toast('Nichts gehört')};
 r.onend=()=>{rec=null;mic.classList.remove('on');inp.placeholder='Artikel hinzufügen…';if(retry){startVoice();return}const t=inp.value.trim();if(t){inp.value='';$('#sugg').hidden=true;addFromText(t)}};
 try{r.start()}catch{rec=null}}
function voiceOverlay(){const o=document.createElement('div');o.className='vo';o.innerHTML=`<button class="mb" aria-label="Tippen zum Sprechen">${ic('mic')}</button><div><b style="font-size:20px">Tippen zum Sprechen</b><p class="hint">z. B. «Milch, 2 Bananen und Brot bei Migros»</p></div><button class="btn" id="vx">Schliessen</button>`;
 $('.mb',o).onclick=()=>{o.remove();startVoice()};$('#vx',o).onclick=()=>o.remove();document.body.append(o)}

/* ---------- Auth ---------- */
function showAuth(msg=''){document.body.classList.remove('in');$('#app').innerHTML=`<div class="auth"><img src="icon.svg" alt=""><h1>Postä</h1><p>Gemeinsame Einkaufsliste</p><form id="af"><input type="email" id="em" placeholder="E-Mail" autocomplete="email" required><input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" minlength="6" required><div class="msg" id="am" role="alert">${esc(msg)}</div><button class="btn pri" id="si">Anmelden</button><button type="button" class="btn" id="su">Konto erstellen</button></form></div>`;
 const m=(t,ok)=>{const e=$('#am');e.textContent=t;e.className='msg'+(ok?' ok':'')};
 $('#af').onsubmit=async e=>{e.preventDefault();m('');const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){m(/confirm/i.test(error.message)?'Bitte zuerst die Bestätigungsmail öffnen.':'E-Mail oder Passwort falsch.');return}S.user=data.user;start()};
 $('#su').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||pw.length<6){m('E-Mail und Passwort (min. 6 Zeichen) eingeben.');return}m('');
  const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){m(/password/i.test(error.message)?'Passwort zu schwach (min. 6 Zeichen).':/already|registered/i.test(error.message)?'Konto existiert bereits – bitte anmelden.':'Kein Zugriff');return}
  if(data.session){S.user=data.user;start()}else m('Bestätigungsmail prüfen, dann hier anmelden.',true)}}

/* ---------- Start ---------- */
let started=false;
async function start(){const c=LS.get('pq.cache',null);if(c){Object.assign(S,{lists:c.lists||[],stores:c.stores||[],items:c.items||[],cat:c.cat||{},token:c.token||null})}
 if(!S.lists.some(l=>l.id===S.listId))S.listId=S.lists[0]?.id||null;buildShell();render();subscribe();
 try{await load();await ensureList();render()}catch(e){if(e.denied){denied();return}toast('Offline – zuletzt gespeicherter Stand')}
 flush();
 if(!started){started=true;const add=P.get('add'),v=P.get('voice');if(add||v){history.replaceState(null,'',location.pathname+location.hash)}
  if(add)addFromText(add);if(v==='1')voiceOverlay()}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){S.user=null;localStorage.removeItem('pq.cache');queue=[];LS.set('pq.queue',[]);started=false;if(chan)sb.removeChannel(chan);chan=null;showAuth()}});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session){S.user=session.user;start()}else showAuth()})();
</script>
