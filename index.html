  if(kind==='cat'){const order=$$('#main .grp').map(s=>s.dataset.cat);S.catOrder=[...order,...S.catOrder.filter(c=>!order.includes(c))];LS.set('pq.catorder',S.catOrder)}
  else{const id=el.dataset.id,grid=el.parentNode,sib=n=>n&&n.classList?.contains('tile')&&!n.classList.contains('dragging')?S.items.find(i=>i.id===n.dataset.id):null;
   const p=sib(el.previousElementSibling),n=sib(el.nextElementSibling),it=S.items.find(i=>i.id===id);const patch={};
   if(p&&n)patch.sort=(p.sort+n.sort)/2;else if(p)patch.sort=p.sort+1;else if(n)patch.sort=n.sort-1;
   const cat=grid.dataset.cat;if(S.group&&cat&&cat!==it.category){patch.category=cat;putCatalog(it.name,cat,it.store_ids||[],false)}
   if(Object.keys(patch).length)upItem(id,patch)}}
 if(S.dirty||commit){S.dirty=false;render()}}

/* ---------- Sheets ---------- */
function sheet(html,{top,onClose}={}){const o=document.createElement('div');o.className='ov'+(top?' top':'');o.innerHTML=`<div class="sh" role="dialog" aria-modal="true"><div class="grab"></div><div class="body">${html}</div></div>`;
 o.addEventListener('pointerdown',e=>{if(e.target===o)closeSheet()});document.body.append(o);requestAnimationFrame(()=>o.classList.add('open'));S.sheets.push({o,onClose});return $('.body',o)}
function closeSheet(){const s=S.sheets.pop();if(!s)return;s.o.classList.remove('open');setTimeout(()=>s.o.remove(),220);s.onClose?.()}
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheets.length)closeSheet()});
function askText(title,val='',ok='OK'){return new Promise(res=>{let done=false;const b=sheet(`<h3>${esc(title)}</h3><input id="aq" value="${esc(val)}" maxlength="60"><div class="row"><button class="btn" id="ax">Abbrechen</button><button class="btn pri" id="ao">${ok}</button></div>`,{top:true,onClose:()=>{if(!done)res(null)}});
 const i=$('#aq',b);setTimeout(()=>{i.focus();i.select()},250);const go=()=>{done=true;res(i.value.trim()||null);closeSheet()};$('#ao',b).onclick=go;$('#ax',b).onclick=()=>closeSheet();i.onkeydown=e=>{if(e.key==='Enter')go()}})}
function askConfirm(title,ok='Löschen'){return new Promise(res=>{let done=false;const b=sheet(`<h3>${esc(title)}</h3><div class="row"><button class="btn" id="ax">Abbrechen</button><button class="btn pri" id="ao">${ok}</button></div>`,{top:true,onClose:()=>{if(!done)res(false)}});$('#ao',b).onclick=()=>{done=true;res(true);closeSheet()};$('#ax',b).onclick=()=>closeSheet()})}
const storeChip=(s,on)=>`<button class="chip${on?' on':''}" data-st="${s.id}"><span class="d" style="background:${on?'currentColor':esc(s.color)}"></span>${esc(s.name)}</button>`;
function openDetail(id){const it=S.items.find(i=>i.id===id);if(!it)return;const sel=new Set(it.store_ids||[]);
 const cats=[...new Set([...CATS,it.category])];
 const b=sheet(`<h3>Artikel bearbeiten</h3><label for="dn">Name</label><input id="dn" value="${esc(it.name)}" maxlength="80"><label for="ds">Menge / Details</label><input id="ds" value="${esc(it.spec||'')}" placeholder="z. B. 2 l" maxlength="40"><label for="dc">Kategorie</label><select id="dc">${cats.map(c=>`<option${c===it.category?' selected':''}>${esc(c)}</option>`).join('')}</select><div class="lbl">Geschäfte</div><div class="chips" id="dst">${S.stores.map(s=>storeChip(s,sel.has(s.id))).join('')||'<span class="hint">Noch keine Geschäfte – in den Einstellungen hinzufügen.</span>'}</div><div class="row"><button class="btn danger" id="dd">Löschen</button><button class="btn pri" id="dok">Fertig</button></div>`);
 $('#dst',b).onclick=e=>{const c=e.target.closest('[data-st]');if(!c)return;const s=S.stores.find(x=>x.id===c.dataset.st);sel.has(s.id)?sel.delete(s.id):sel.add(s.id);c.outerHTML=storeChip(s,sel.has(s.id))};
 $('#dd',b).onclick=()=>{delItem(id);closeSheet();toast('Gelöscht')};
 $('#dok',b).onclick=()=>{const name=$('#dn',b).value.trim()||it.name,spec=$('#ds',b).value.trim()||null,category=$('#dc',b).value,store_ids=S.stores.filter(s=>sel.has(s.id)).map(s=>s.id);
  upItem(id,{name,spec,category,store_ids});putCatalog(name,category,store_ids,false);closeSheet()}}
function openLists(){const b=sheet('');const draw=()=>{b.innerHTML=`<h3>Listen</h3>${S.lists.map(l=>`<div class="item${l.id===S.listId?' sel':''}"><button class="n" data-sel="${l.id}" style="min-height:44px;text-align:left">${esc(l.name)}${l.id===S.listId?' ✓':''}</button><button class="ib" data-ren="${l.id}" aria-label="Umbenennen">✎</button><button class="ib" data-del="${l.id}" aria-label="Löschen">✕</button></div>`).join('')}<div class="row"><button class="btn pri" id="ln">Neue Liste</button></div>`};draw();
 b.onclick=async e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.sel){S.listId=t.dataset.sel;S.filter=null;LS.set('pq.list',S.listId);render();closeSheet()}
  else if(t.dataset.ren){const l=S.lists.find(x=>x.id===t.dataset.ren),n=await askText('Liste umbenennen',l.name);if(n){l.name=n;enqueue({t:'lists',o:'update',id:l.id,d:{name:n}});draw();render()}}
  else if(t.dataset.del){if(S.lists.length<2){toast('Mindestens eine Liste nötig');return}const l=S.lists.find(x=>x.id===t.dataset.del);if(await askConfirm(`«${l.name}» löschen?`)){S.lists=S.lists.filter(x=>x!==l);S.items=S.items.filter(i=>i.list_id!==l.id);enqueue({t:'lists',o:'delete',id:l.id});if(S.listId===l.id){S.listId=S.lists[0].id;LS.set('pq.list',S.listId)}draw();render()}}
  else if(t.id==='ln'){const n=await askText('Neue Liste','', 'Erstellen');if(n){const l={id:uid(),name:n,sort:(S.lists.at(-1)?.sort||0)+1,created_at:now()};S.lists.push(l);enqueue({t:'lists',o:'insert',d:l});S.listId=l.id;LS.set('pq.list',l.id);render();closeSheet()}}}}
function openSettings(){const b=sheet('');const ep=SB_URL+'/functions/v1/add';
 const draw=()=>{b.innerHTML=`<h3>Einstellungen</h3><h4>Listen</h4><button class="btn" id="sl" style="width:100%">Listen verwalten (${S.lists.length})</button>
<h4>Geschäfte</h4>${S.stores.map((s,i)=>`<div class="item" data-id="${s.id}"><input type="color" value="${esc(s.color)}" data-col aria-label="Farbe"><input class="in2" value="${esc(s.name)}" data-nm aria-label="Name" maxlength="40"><button class="ib" data-up ${i?'':'disabled'} aria-label="Nach oben">↑</button><button class="ib" data-dn ${i<S.stores.length-1?'':'disabled'} aria-label="Nach unten">↓</button><button class="ib" data-rm aria-label="Löschen">✕</button></div>`).join('')}<div class="row" style="margin-top:12px"><input id="sn" placeholder="Neues Geschäft"><button class="btn pri sm" id="sa" style="flex:none">Hinzufügen</button></div>
<h4>Sprachassistent</h4><div class="lbl">Dein Token</div><code id="tk">${esc(S.token||'– nicht verfügbar –')}</code><button class="btn sm" data-cp="${esc(S.token||'')}">Token kopieren</button><div class="lbl" style="margin-top:12px">Endpunkt</div><code>${ep}</code><button class="btn sm" data-cp="${ep}">URL kopieren</button>
<div class="hint"><p><b>iPhone:</b> Kurzbefehl «Postä» anlegen: «Diktat» → «Inhalte von URL abrufen» (Methode POST, JSON mit <i>text</i> = Diktierter Text, Header <i>x-postae-token</i> = dein Token). Danach «Hey Siri, Postä».</p><p><b>Android:</b> «Hey Google, öffne Postä» oder App-Verknüpfung «Sprechen» – öffnet Postä mit <i>?voice=1</i> und startet die Spracheingabe.</p></div>
<h4>Konto</h4><div class="hint" style="margin-bottom:8px">${esc(S.user?.email||'')}</div><button class="btn danger" id="lo" style="width:100%">Abmelden</button>`};draw();
 b.onclick=async e=>{const t=e.target.closest('button');if(!t)return;const row=t.closest('[data-id]'),s=row&&S.stores.find(x=>x.id===row.dataset.id);
  if(t.id==='sl'){openLists()}
  else if(t.dataset.cp!==undefined){try{await navigator.clipboard.writeText(t.dataset.cp);toast('Kopiert')}catch{toast('Kopieren nicht möglich')}}
  else if(t.id==='sa'){const n=$('#sn',b).value.trim();if(!n)return;if(S.stores.some(x=>x.name.toLowerCase()===n.toLowerCase())){toast('Gibt es schon');return}const st={id:uid(),name:n,color:PAL[S.stores.length%PAL.length],sort:(S.stores.at(-1)?.sort||0)+1};S.stores.push(st);enqueue({t:'stores',o:'insert',d:st});draw();render()}
  else if(t.id==='lo'){closeSheet();await flush();await sb.auth.signOut()}
  else if(s&&(t.hasAttribute('data-up')||t.hasAttribute('data-dn'))){const i=S.stores.indexOf(s),j=i+(t.hasAttribute('data-up')?-1:1),o=S.stores[j];if(!o)return;[s.sort,o.sort]=[o.sort,s.sort];S.stores.sort((a,b)=>a.sort-b.sort);enqueue({t:'stores',o:'update',id:s.id,d:{sort:s.sort}});enqueue({t:'stores',o:'update',id:o.id,d:{sort:o.sort}});draw();render()}
  else if(s&&t.hasAttribute('data-rm')){if(!await askConfirm(`«${s.name}» löschen?`))return;S.items.filter(i=>i.store_ids?.includes(s.id)).forEach(i=>upItem(i.id,{store_ids:i.store_ids.filter(x=>x!==s.id)}));S.stores=S.stores.filter(x=>x!==s);if(S.filter===s.id)S.filter=null;enqueue({t:'stores',o:'delete',id:s.id});draw();render()}};
 b.onchange=e=>{const row=e.target.closest('[data-id]'),s=row&&S.stores.find(x=>x.id===row.dataset.id);if(!s)return;
  if(e.target.hasAttribute('data-col')){s.color=e.target.value;enqueue({t:'stores',o:'update',id:s.id,d:{color:s.color}});render()}
  else if(e.target.hasAttribute('data-nm')){const n=e.target.value.trim();if(!n||S.stores.some(x=>x!==s&&x.name.toLowerCase()===n.toLowerCase())){e.target.value=s.name;return}s.name=n;enqueue({t:'stores',o:'update',id:s.id,d:{name:n}});render()}}}

/* ---------- Sprache ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,lang='de-CH';
function startVoice(){const inp=$('#addIn'),mic=$('#micBtn');if(!SR){toast('Spracheingabe wird hier nicht unterstützt');return}
 if(rec){rec.stop();return}
 const r=rec=new SR();r.lang=lang;r.interimResults=true;r.continuous=false;let retry=false;
 r.onstart=()=>{mic.classList.add('on');inp.placeholder='Ich höre zu…'};
 r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript+' ';inp.value=t.trim()};
 r.onerror=e=>{if((e.error==='language-not-supported'||e.error==='service-not-allowed')&&lang==='de-CH'){lang='de-DE';retry=true}else if(e.error==='not-allowed')toast('Mikrofon nicht erlaubt');else if(e.error==='no-speech')toast('Nichts gehört')};
 r.onend=()=>{rec=null;mic.classList.remove('on');inp.placeholder='Artikel hinzufügen…';if(retry){startVoice();return}const t=inp.value.trim();if(t){inp.value='';$('#sugg').hidden=true;addFromText(t,{voice:true})}};
 try{r.start()}catch{rec=null}}
function voiceOverlay(){const o=document.createElement('div');o.className='vo';o.innerHTML=`<button class="mb" aria-label="Tippen zum Sprechen">${ic('mic')}</button><div><b style="font-size:20px">Tippen zum Sprechen</b><p class="hint">z. B. «Milch, 2 Bananen und Brot bei Migros»</p></div><button class="btn" id="vx">Schliessen</button>`;
 $('.mb',o).onclick=()=>{o.remove();startVoice()};$('#vx',o).onclick=()=>o.remove();document.body.append(o)}

/* ---------- Auth ---------- */
function showAuth(msg=''){document.body.classList.remove('in');$('#app').innerHTML=`<div class="auth"><img src="icon.svg" alt=""><h1>Postä</h1><p>Gemeinsame Einkaufsliste</p><form id="af"><input type="email" id="em" placeholder="E-Mail" autocomplete="email" required><input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" minlength="6" required><div class="msg" id="am" role="alert">${esc(msg)}</div><button class="btn pri" id="si">Anmelden</button><button type="button" class="btn" id="su">Konto erstellen</button></form></div>`;
 const m=(t,ok)=>{const e=$('#am');e.textContent=t;e.className='msg'+(ok?' ok':'')};
 $('#af').onsubmit=async e=>{e.preventDefault();m('');const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){m(/confirm/i.test(error.message)?'Bitte zuerst die Bestätigungsmail öffnen.':'E-Mail oder Passwort falsch.');return}S.user=data.user;start()};
 $('#su').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||pw.length<6){m('E-Mail und Passwort (min. 6 Zeichen) eingeben.');return}m('');
  const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){m(/password/i.test(error.message)?'Passwort zu schwach (min. 6 Zeichen).':/already|registered/i.test(error.message)?'Konto existiert bereits – bitte anmelden.':'Kein Zugriff');return}
  if(data.session){S.user=data.user;start()}else m('Bestätigungsmail prüfen, dann hier anmelden.',true)}}

/* ---------- Start ---------- */
let started=false;
async function start(){const c=LS.get('pq.cache',null);if(c){Object.assign(S,{lists:c.lists||[],stores:c.stores||[],items:c.items||[],cat:c.cat||{},token:c.token||null})}
 if(!S.lists.some(l=>l.id===S.listId))S.listId=S.lists[0]?.id||null;buildShell();render();subscribe();
 try{await load();await ensureList();render()}catch(e){if(e.denied){denied();return}toast('Offline – zuletzt gespeicherter Stand')}
 flush();
 if(!started){started=true;const add=P.get('add'),v=P.get('voice');if(add||v){history.replaceState(null,'',location.pathname+location.hash)}
  if(add)addFromText(add);if(v==='1')voiceOverlay()}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){S.user=null;localStorage.removeItem('pq.cache');queue=[];LS.set('pq.queue',[]);started=false;if(chan)sb.removeChannel(chan);chan=null;showAuth()}});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session){S.user=session.user;start()}else showAuth()})();
</script>
