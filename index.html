 {let lt=null,fired=false;const clr=()=>{clearTimeout(lt);lt=null};

<div class="cc" id="cc"><div class="ccr"><span class="dot" id="cd"></span><b id="cl2">${E('store.custom_color')}</b><div class="hx"><span aria-hidden="true">#</span><input id="hx" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="${E('store.hex_aria')}"></div></div>

 const sn=$('#sn',b),hx=$('#hx',b),hu=$('#hu',b),pad=$('#pad',b),cc=$('#cc',b);
 const paint=skip=>{const c=d.color,ink=inkOf(c),nm=sn.value.trim();
  $('#pva',b).innerHTML=avHTML({name:nm||T('store.default_name'),color:c},'xl');$('#pvb',b).innerHTML=bgOne({name:nm||T('store.default_name'),color:c});
  $$('.swb',b).forEach(x=>{const on=x.dataset.c===c;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);x.firstElementChild.style.color=ink});
  $('#cd',b).style.background=c;if(skip!=='hx'){hx.value=c.slice(1);hx.removeAttribute('aria-invalid')}if(skip!=='hu')hu.value=Math.round(H);
  cc.style.setProperty('--h',H);const th=pad.firstElementChild;th.style.left=Sa*100+'%';th.style.top=(1-V)*100+'%';th.style.background=c;
  pad.setAttribute('aria-valuetext',T('store.pad_value',{s:Math.round(Sa*100),v:Math.round(V*100)}))};
 const setHex=(c,skip)=>{d.color=c.toUpperCase();const[h,s,v]=rgb2hsv(...hex2rgb(d.color));if(s>0&&v>0)H=h;Sa=s;V=v;paint(skip)};

 $('#kk',b).onclick=e=>{const c=e.target.closest('[data-k]');if(!c)return;d.kind=c.dataset.k;$$('.chip',$('#kk',b)).forEach(x=>{x.classList.toggle('on',x===c);x.setAttribute('aria-checked',x===c)})};

 let pd=false;const padAt=e=>{const r=pad.getBoundingClientRect();Sa=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));V=1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));fromHsv()};

/* ---------- Sprache ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,vlang='';
function startVoice(){const inp=$('#addIn'),mic=$('#micBtn');if(!SR){toast(T('voice.unsupported'));return}
 if(rec){rec.stop();return}
 const r=rec=new SR();r.lang=vlang||locale();r.interimResults=true;r.continuous=false;let retry=false;
 r.onstart=()=>{mic.classList.add('on');inp.placeholder=T('voice.listening')};
 r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript+' ';inp.value=t.trim()};
 r.onerror=e=>{if((e.error==='language-not-supported'||e.error==='service-not-allowed')&&!vlang){const b0=locale().split('-')[0];vlang=b0==='de'?'de-DE':b0;retry=true}else if(e.error==='not-allowed')toast(T('voice.mic_denied'));else if(e.error==='no-speech')toast(T('voice.no_speech'))};
 r.onend=()=>{rec=null;mic.classList.remove('on');inp.placeholder=T('add.placeholder');if(retry){startVoice();return}const t=inp.value.trim();if(t){inp.value='';$('#sugg').hidden=true;addFromText(t)}};
 try{r.start()}catch{rec=null}}
function voiceOverlay(){const o=document.createElement('div');o.className='vo';o.innerHTML=`<button class="mb" aria-label="${E('voice.tap')}">${ic('mic')}</button><div><b style="font-size:20px">${E('voice.tap')}</b><p class="hint">${E('voice.example')}</p></div><button class="btn" id="vx">${E('common.close')}</button>`;
 $('.mb',o).onclick=()=>{o.remove();startVoice()};$('#vx',o).onclick=()=>o.remove();document.body.append(o)}

 const m=(t,ok)=>{const e=$('#am');e.textContent=t;e.className='msg'+(ok?' ok':'')};
 $('#af').onsubmit=async e=>{e.preventDefault();m('');const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){m(T(/confirm/i.test(error.message)?'auth.err_confirm':'auth.err_bad'));return}S.user=data.user;start()};
 $('#su').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||pw.length<6){m(T('auth.err_fields'));return}m('');
  const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){m(T(/password/i.test(error.message)?'auth.err_weak':/already|registered/i.test(error.message)?'auth.err_exists':'auth.no_access'));return}
  if(data.session){S.user=data.user;start()}else m(T('auth.check_mail'),true)}}
