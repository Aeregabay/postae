name: Supabase keepalive
# Hält das Gratis-Projekt aktiv (pausiert sonst nach 7 Tagen ohne Nutzung).
# Läuft am 1., 6., 11., 16., 21., 26. und 31. jedes Monats → max. 6 Tage Abstand.
on:
  schedule:
    - cron: "23 4 */5 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -X POST https://dzuhqugacawaqfcvayoa.supabase.co/functions/v1/keepalive
